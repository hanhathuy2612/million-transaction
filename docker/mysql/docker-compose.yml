services:
  mysql-master:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MYSQL_CNF: mysql-master.cnf
    image: million-transaction-mysql-master:8.0
    container_name: mt-mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: FormosVN@123
      MYSQL_DATABASE: millions_transaction
      MYSQL_USER: millions_user
      MYSQL_PASSWORD: millions_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  mysql-slave:
    build:
      context: .
      dockerfile: Dockerfile.slave
    image: million-transaction-mysql-slave:8.0
    container_name: mt-mysql-slave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: FormosVN@123
    ports:
      - "3308:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
    networks:
      - app-network
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  adminer:
    image: adminer
    container_name: mt-adminer
    restart: always
    ports:
      - "8089:8080"
    networks:
      - app-network
    depends_on:
      - mysql-master
      - mysql-slave

volumes:
  mysql_master_data:
  mysql_slave_data:

networks:
  app-network:
    driver: bridge
