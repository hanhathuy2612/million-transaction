server:
  port: 0 # Random port for testing

spring:
  application:
    name: millions-transaction-test

  # Test database configuration (overridden by TestContainers)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # Disable Liquibase for tests (use JPA DDL instead)
  liquibase:
    enabled: false

  # Test Redis configuration (overridden by TestContainers)
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 1000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Test Kafka configuration (overridden by TestContainers)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      enable-idempotence: true
    consumer:
      group-id: payments-service-test
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.integration.IntegrationAutoConfiguration

# Disable scheduling for tests
outbox:
  relay:
    interval: 0

# Simple logging for tests
logging:
  level:
    com.hnh.example.transaction_example: INFO
    org.springframework.web: INFO
