server:
  port: 0 # Random port for testing

spring:
  application:
    name: millions-transaction-test

  # Test database configuration (overridden by TestContainers)
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # Disable Liquibase for tests (use JPA DDL instead)
  liquibase:
    enabled: false

  # Test Redis configuration (overridden by TestContainers)
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 1000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Test Kafka configuration (overridden by TestContainers)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      enable-idempotence: true
    consumer:
      group-id: payments-service-test
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100

# Test outbox relay configuration
outbox:
  relay:
    interval: 1000 # Faster interval for testing

# Test management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: false # Disable prometheus for tests

# Test logging configuration
logging:
  level:
    com.hnh.example.transaction_example: DEBUG
    org.springframework.kafka: WARN
    org.springframework.data.redis: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    org.testcontainers: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT configuration for tests
app:
  security:
    authentication:
      jwt:
        base64-secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHk=
        expiration: 86400000 # 24 hours
