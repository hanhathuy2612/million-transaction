server:
  port: 8888
spring:
  application:
    name: millions-transaction
  datasource:
    url: jdbc:mysql://localhost:3306/millions_transaction
    username: root
    password: FormosVN@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 80
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  data:
    redis:
      host: localhost
      password: redis123
      port: 6379
      timeout: 2000ms
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      enable-idempotence: true
    consumer:
      group-id: payments-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100

# Outbox relay configuration
outbox:
  relay:
    interval: 5000

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Logging configuration
logging:
  level:
    com.hnh.example.transaction_example: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO
    org.springdoc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# =========================
# Springdoc / Swagger-UI
# =========================
springdoc:
  # --- OpenAPI JSON endpoints ---
  api-docs:
    # Keep the canonical path; tools expect /v3/api-docs
    path: /v3/api-docs
    # Optional: smaller, cleaner schemas
    resolve-schema-properties: true
    remove-broken-reference-definitions: true
    # Optional: disable caching while developing (default is true in prod)
    enabled: true
  # --- Swagger UI (HTML/JS app) ---
  swagger-ui:
    # UI entry (redirects to /swagger-ui/index.html)
    path: /swagger-ui.html
    # Tell UI where your spec lives (prevents petstore default)
    url: /v3/api-docs
    # Let UI auto-load the URL above
    disable-swagger-default-url: true
    # (Only use this if you’ve changed api-docs.path or have a base path)
    config-url: /v3/api-docs/swagger-config
    # Sorting & layout
    operations-sorter: method # alpha | method
    tags-sorter: alpha # alpha or method
    doc-expansion: none # none | list | full
    deep-linking: true
    display-request-duration: true
    display-operation-id: false
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    default-model-renderer: example # model | example
    show-common-extensions: true
    show-extensions: true
    # "Try it out" & code snippets
    try-it-out-enabled: true
    request-snippets-enabled: true
    response-snippets-enabled: true
    # Syntax highlight in the UI
    syntax-highlight:
      activated: true
      theme: agate # vs, obsidian, agate, etc.
    # UI extras
    filter: true # client-side filter box
  # --- Limit scanning scope (recommended) ---
  # Only scan your API package(s) and only include path patterns below.
  packages-to-scan: com.hnh.example.transaction_example.controller
  paths-to-match: /api/**

